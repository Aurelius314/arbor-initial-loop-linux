schema_version: 1
name: initial_loop_cop
description: "Evolve initial_loop.py to minimize mean optimality gap across COP problems"

eval_contract:
  metric_direction: minimize
  eval_cmd: 'python eval.py --split dev'
  eval_cmd_test: 'python eval.py --split test'
  eval_timeout: 14400
  dataset_info: "Each data/<problem>/ directory contains dev.json and test.json"

protected_paths:
  - "data/**"
  - "evaluation/**"
  - "eval.py"
  - "plugins/**"

meta_preamble_inject: |
  Evolve the agent harness `initial_loop.py` to minimize mean optimality gap across the configured
  combinatorial optimization problems.
  You may modify prompts, context and memory management, skills,
  parsing, error recovery, rollout orchestration, and other control logic
  inside `initial_loop.py`. Do not modify data, evaluators, model or API configuration, or scoring.
  Do not run a test baseline during initialization. Run `python eval.py --split test` only as
  a held-out admission gate after a candidate's dev score is lower than the current dev trunk
  score (initially the dev baseline score).
  Do not directly inspect or execute anything under `arbor-bin/`; use only the scoped
  `ReadDevTrace` tool for current-run, current-node development trajectory evidence.
  The host terminal is Windows PowerShell. Use PowerShell-native syntax for every command
  (for example, `Get-ChildItem -Name`); do not use CMD/Bash-only forms such as `dir /B`,
  `grep`, or `&&`. For JSON inspection, use `Get-Content -Raw | ConvertFrom-Json`; avoid
  nested quoted expressions in `python -c`.

sub_workflow_inject: |
  Edit only the agent harness `initial_loop.py`.
  Data flow: `eval.py` supplies a public COP instance and protected evaluation tool;
  `SimpleEvol.evolve()` returns `(best_solution, best_objective)`, then `eval.py` computes each
  instance's optimality gap against its protected reference. It first computes one mean gap for
  each of exactly seven problems (TSP, OP, CVRP, MIS, MVC, PFSP, JSSP), then reports their
  equal-weight macro-average, `(TSP + OP + CVRP + MIS + MVC + PFSP + JSSP) / 7`, as `score`
  (lower is better); instance counts never change a problem's weight.
  The only official commands are **exactly as written and must be executed directly from the
  current worktree root**: `python eval.py --split dev` for development, and
  `python eval.py --split test` for held-out admission only after a candidate's dev score is
  lower than the current dev trunk score (initially the dev baseline score). 
  Never run a test baseline during initialization.
  After modifying `initial_loop.py`, first run `python -m py_compile initial_loop.py` and fix
  every syntax error before starting the protected development evaluation.
  Before the formal development evaluation, verify with observable evidence that every newly
  introduced mechanism is actually exercised end to end (for example, confirm its call path,
  state change, generated artifact, or targeted log entry). If the mechanism is unreachable,
  inactive, or only partially wired, continue fixing it; do not submit an evaluation result or
  conclude that the research hypothesis failed merely because the code compiles or eval exits.
  Preserve the `_emit_trace`/`trace_sink` observability contract. After formal dev evaluation,
  use the automatically returned trajectory digest; call `ReadDevTrace` only for the specific
  failure, summary, timeline, or experiment detail needed to explain the result.
  After every candidate implementation, you must run the protected development evaluator
  `python eval.py --split dev`; its reported `score:` is the only official candidate result.
  Local unit checks or `python -c` commands may assist debugging but must never replace the
  protected development evaluation, and any non-zero exit or traceback must be investigated.
  Keep the harness candidate compatible with the protected evaluator: 
  the module must expose a callable `SimpleEvol` constructor, 
  and the resulting object must provide `evolve()`.
  The host terminal is Windows PowerShell. Use PowerShell-native syntax for every command
  (for example, `Get-ChildItem -Name`); do not use CMD/Bash-only forms such as `dir /B`,
  `grep`, or `&&`. For JSON inspection, use `Get-Content -Raw | ConvertFrom-Json`; avoid
  nested quoted expressions in `python -c`.

profiles:
  smoke:
    max_cycles: 3
    executor_max_turns: 15
    max_tree_depth: 2
  paper:
    time_budget: 172800
    max_cycles: 20
    max_tree_depth: 2
