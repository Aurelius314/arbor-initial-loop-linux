schema_version: 1
name: initial_loop_tsp
description: "Evolve initial_loop.py to minimize mean Euclidean TSP optimality gap"

eval_contract:
  metric_direction: minimize
  eval_cmd: "python {cwd}/eval.py --split dev"
  eval_cmd_test: "python {cwd}/eval.py --split test"
  eval_timeout: 3600
  dataset_info: "data/tsp/dev.json is used for evolution; data/tsp/test.json is held out for evaluation"

protected_paths:
  - "data/**"
  - "evaluation/**"
  - "eval.py"
  - "plugins/**"

meta_preamble_inject: |
  Evolve `initial_loop.py` to minimize mean TSP optimality gap. One Arbor
  experiment is one complete candidate harness evaluated across the dev split.
  Do not assume or predefine the tree's first-level research directions.

sub_workflow_inject: |
  Edit only `initial_loop.py`. Run `python eval.py --split dev` to evaluate the
  candidate. Do not run the test split during ordinary experimentation. Keep
  the public `solve_instance(instance, call_model, config=...)` entry point.

profiles:
  smoke:
    max_cycles: 3
    executor_max_turns: 12
    max_tree_depth: 2
