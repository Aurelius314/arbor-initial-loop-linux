plugin: initial_loop_cop
plugin_profile: paper

coordinator:
  max_cycles: 20
  max_turns: 500
  executor_max_turns: 50
  executor_timeout: 172800
  merge_threshold: 5.0
  eval_retries: 1
  enforce_protected: true

context:
  window: 200000
  compact_threshold: 0.80
  compact_keep_recent: 20

convergence:
  window_size: 5
  warn_after: 3
  stop_after: 8

ui:
  interaction_mode: auto
